[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "karpyoplot"
dynamic = ["version"]
description = "Python implementation of Bernat Gel and Eduard Serra's karyoploteR"
authors = [
    { name="Zoeb Jamal", email="zoebjams@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.0",
]
keywords = ["chromosome ideogram", "karyoplot", "karyotype"]

[tool.hatch.version]
path = "src/karpyoplot/__init__.py"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/karpyoplot"]

[project.urls]
Homepage = "https://github.com/zoebjamal/karpyoplot"
Issues = "https://github.com/zoebjamal/karpyoplot/issues"
